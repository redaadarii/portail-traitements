# Bundle : décrit en code tout ce qu'on déploie dans Databricks.
# Commandes : databricks bundle validate | deploy | run | destroy

bundle:
  name: portail-traitements

variables:
  catalog:
    description: Catalogue Unity Catalog
    default: workspace
  schema:
    description: Schéma du projet
    default: portail

targets:
  dev:
    # Mode développement : ressources préfixées "[dev <ton nom>]", plannings en pause.
    mode: development
    default: true
    workspace:
      host: https://dbc-18ef0795-e41e.cloud.databricks.com

resources:
  jobs:
    import_budget:
      name: import_budget

      parameters:
        - name: periode
          default: "2026-10"
        - name: fichier
          default: /Volumes/${var.catalog}/${var.schema}/fichiers/budget_2026_10.xlsx

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./setup/setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: import
          depends_on:
            - task_key: setup
          max_retries: 0 # une erreur de données ne se corrige pas en relançant
          notebook_task:
            notebook_path: ./jobs/import_budget.py

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

  apps:
    portail:
      name: portail-traitements
      description: Saisie des paramètres, dépôt du fichier Excel et suivi des imports budget
      source_code_path: ./webapp

      # Ce que l'application a le droit de toucher, et rien de plus (moindre privilège).
      # Les droits sont donnés au service principal de l'app, pas aux utilisateurs.
      resources:
        - name: app-job
          job:
            id: ${resources.jobs.import_budget.id}
            permission: CAN_MANAGE_RUN # lancer et suivre le job, mais pas le modifier

        - name: app-volume
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.fichiers
            securable_type: VOLUME
            permission: WRITE_VOLUME # déposer les fichiers Excel
